[package]
version = "1.1.0"
name = "koerier"
description = "A self-hosted lightning address server for LND"
authors = ["Luis Schwab <dev@luisschwab.net"]
repository = "https://github.com/luisschwab/koerier"
documentation = "https://docs.rs/koerier"
keywords = ["bitcoin", "lightning", "lnd", "webserver"]
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.85.0" # MSRV

[[bin]]
name = "koerier"
path = "src/koerier.rs"

[dependencies]
axum = { version = "=0.8.9" }
base64 = { version = "=0.22.1" }
clap = { version = "=4.6.5", features = ["derive"] }
hex = { version = "=0.4.3" }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
rand = { version = "=0.10.2" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
sha2 = { version = "=0.11.0" }
tokio = { version = "=1.53.0", features = ["rt-multi-thread", "net", "macros"] }
toml = { version = "=1.1.3" }
# Pinned transitive deps:
anyhow = { version = "=1.0.104", default-features = false } # blame: rand@0.10.2 -> getrandom@0.4.2 -> wasip3@0.4.0+wasi-0.3.0-rc-2026-01-06 -> wit-bindgen@0.51.0 -> wit-bindgen-rust-macro@0.51.0 -> anyhow@1.0.102 (RUSTSEC-2026-0190)
bumpalo = { version = "=3.20.3", default-features = false } # blame: reqwest@0.13.4 -> wasm-bindgen@0.2.100 -> wasm-bindgen-macro@0.2.100 -> wasm-bindgen-macro-support@0.2.100 -> wasm-bindgen-backend@0.2.100 -> bumpalo@3.2.1 (RUSTSEC-2022-0078)
bytes = { version = "=1.12.1", default-features = false } # blame: reqwest@0.13.4 -> bytes@1.7.1 (RUSTSEC-2026-0007)
chrono = { version = "=0.4.45", default-features = false } # blame: image@0.25.9 -> moxcms@0.7.4 -> chrono@0.4.0 -> time@0.1.36 (RUSTSEC-2020-0159, RUSTSEC-2020-0071)
cxx = { version = "=1.0.198" } # blame: image@0.25.9 -> moxcms@0.7.4 -> chrono@0.4.45 -> iana-time-zone@0.1.56 -> iana-time-zone-haiku@0.1.1 -> cxx@1.0.93 (RUSTSEC-2026-0202)
lazy_static = { version = "=1.5.0" } # blame: tracing-subscriber@0.3.23 -> sharded-slab@0.1.4 -> lazy_static@1.0.0
num-traits = { version = "=0.2.19" } # blame: image@0.25.9 -> moxcms@0.7.4 -> pxfm@0.1.1 -> num-traits@0.2.0
ring = { version = "=0.17.14", default-features = false } # blame: rustls@0.23.42 -> ring@0.17.0 (RUSTSEC-2025-0009)
rustls-native-certs = { version = "=0.8.4", default-features = false } # blame: reqwest@0.13.4 -> rustls-platform-verifier@0.6.0 -> rustls-native-certs@0.8.0 -> rustls-pemfile@2.0.0 (RUSTSEC-2025-0134)
rustls-webpki = { version = "=0.103.13", default-features = false } # blame: rustls@0.23.42 -> rustls-webpki@0.103.5 (RUSTSEC-2026-0049, RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104)
url = { version = "=2.5.8", default-features = false } # blame: reqwest@0.13.4 -> url@2.4.0 -> idna@0.4.0 (RUSTSEC-2024-0421)

[package.metadata.rbmt]
version = "0.5.1"
toolchains = { stable = "1.97.1", nightly = "nightly-2026-07-17" }
tools = { cargo-audit = "=0.22.2", zizmor = "=1.26.1" }
test = { sample_strategy = "all" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.lint]
allowed_duplicates = [
    "bumpalo",
    "getrandom",
    "syn",
    "wit-bindgen",
    "windows-sys"
]

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

# Copied over from `rust-bitcoin`
[workspace.lints.clippy]
# Exclude lints we don't think are valuable.
needless_question_mark = "allow" # https://github.com/rust-bitcoin/rust-bitcoin/pull/2134
manual_range_contains = "allow" # More readable than clippy's format.
# Exhaustive list of pedantic clippy lints
assigning_clones = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_lossless = "warn"
cast_possible_truncation = "allow" # All casts should include a code comment (except test code).
cast_possible_wrap = "allow" # Same as above re code comment.
cast_precision_loss = "warn"
cast_ptr_alignment = "warn"
cast_sign_loss = "allow" # All casts should include a code comment (except in test code).
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
copy_iterator = "warn"
default_trait_access = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp = "allow" # Bitcoin floats are typically limited to 8 decimal places and we want them exact.
fn_params_excessive_bools = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
implicit_hasher = "warn"
inconsistent_struct_constructor = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
inline_always = "warn"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
items_after_statements = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_without_into_iter = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
many_single_char_names = "warn"
map_unwrap_or = "warn"
match_bool = "allow" # Adds extra indentation and LOC.
match_same_arms = "allow" # Collapses things that are conceptually unrelated to each other.
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
maybe_infinite_iter = "warn"
mismatching_type_param_order = "warn"
missing_docs_in_private_items = "deny"
missing_errors_doc = "warn"
missing_fields_in_debug = "warn"
missing_panics_doc = "warn"
must_use_candidate = "allow" # Useful for audit but many false positives.
mut_mut = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
no_mangle_with_rust_abi = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
ref_binding_to_reference = "warn"
ref_option = "warn"
ref_option_ref = "warn"
return_self_not_must_use = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
similar_names = "allow" # Too many (subjectively) false positives.
single_char_pattern = "warn"
single_match_else = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
string_add_assign = "warn"
struct_excessive_bools = "warn"
struct_field_names = "allow" # dumb
too_many_lines = "warn"
transmute_ptr_to_ptr = "warn"
trivially_copy_pass_by_ref = "warn"
unchecked_time_subtraction = "warn"
unicode_not_nfc = "warn"
uninlined_format_args = "allow" # This is a subjective style choice.
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unsafe_derive_deserialize = "warn"
unused_async = "warn"
unused_self = "warn"
use_self = "warn"
used_underscore_binding = "warn"
used_underscore_items = "warn"
verbose_bit_mask = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"
